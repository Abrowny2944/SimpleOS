<!DOCTYPE html>
  <html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap" rel="stylesheet">
      <title>SimpleOS</title>
      <link rel="icon" path="image/png" href="https://abrowny2944.neocities.org/rubber-duck.png">

      <style>
        html, body {
          margin: 0;
          padding: 0;
          height: 100%;
        }

        body {
          background-image: url('https://abrowny2944.neocities.org/VMBG.png');
          font-family: "Monomaniac One";
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
          background-attachment: fixed;
          min-height: 100vh;
          min-height: 100dvh;
        }

        button {
          font-family: "Monomaniac One";
        }
        
        #welcomepopup {
          position: flex;
          border-radius:15px;
          padding:45px 40px;
          background-color: rgba(20,25,30,0.8);
          border: none;
          color: rgb(120,150,180);
        }

        #welcomepopup button {
          background-color: rgba(60,75,90,0.4);
          color: rgb(120,150,180);
          border:none;
          border-radius:10px;
          padding: 5px 10px;
          outline: none;
          transition: ease 0.2s;
        }

        #welcomepopup button:hover {
          background-color: rgba(120,150,180,0.4);
          color: rgba(20,25,30,0.8);
          transform: scale(1.1);
        }

        #welcomepopup::backdrop {
          background-color: rgba(0,0,0,0.4);
          backdrop-filter: blur(2px);
        }

        #taskbar {
          position:fixed;
          bottom:0;
          left: 0vw;
          background-color:rgba(20,25,30,0.6);
          backdrop-filter: blur(4px);
          width: calc(100% - 16px);
          padding: 8px;
          margin: none;
          border-radius: 25px 15px 0 0;
          box-shadow: 0 0 15px rgba(120,150,180,0.4);
          z-index: 9999;
          justify-content: space-between;
        }

        #taskbar button {
          background-color: rgba(60,75,90,0.4);
          color: rgb(120,150,180);
          border: solid 1px transparent;
          border-radius: 50%;
          padding: 15px;
          outline:none;
          transition:linear 0.2s;
          width:30px;
          height:30px;
          display:flex;
          justify-content: center;
          align-items:center;
        }

        #taskbar button:hover {
          background-color: rgba(120,150,180,0.4);
          color:rgb(20,25,30);
        }

        #taskbar button:active {
          border: solid 1px white;
          border-radius: 10px;
        }

        #launcher {
          position: fixed;
          bottom: 60px;
          left: 10px;
          background-color: rgba(20,25,30,0.6);
          color: rgb(120,150,180);
          backdrop-filter: blur(4px);
          width: 250px;
          height: 350px;
          padding: 8px;
          margin:none;
          border-radius: 15px;
          box-shadow: 0 0 15px rgba(120,150,180,0.4);
          opacity:0;
          pointer-events: none;
          user-select: none;
          transition: ease 0.2s;
          z-index: 9998;
        }

        #taskbar .circle {
          border-radius: 50%;
          border: solid 2px white;
          padding: 5px;
        }

        .appdrag {
          position: absolute;
          width: 420px;
          height: 22px;
          background-color: rgba(20,25,30,0.6);
          backdrop-filter: blur(4px);
          padding: 10px;
          border-radius: 10px 10px 0 0;
          user-select: none;
          cursor: grab;
          display: none;
          top: calc(50% - 222px);
          left: calc(50% - 200px);
        }

        .appdrag:active {
          cursor: grabbing
        }

        .appdrag > button {
          background-color: rgba(60,75,90,0.4);
          color: rgb(120,150,180);
          border: solid 1px transparent;
          border-radius: 50%;
          padding: 15px;
          outline: none;
          transition: linear 0.2s;
          width:30px;
          height:30px;
          display: flex inline;
          justify-content: center;
          align-items: center;
        }

        .appdrag > button:hover {
          background-color: rgba(120,150,180,0.4);
          color: rgb(20,25,30);
        }

        .app {
          background-color: white;
          height: 300px;
          margin-top: 10px;
          outline: solid 10px rgba(20,25,30,0.6);
          border-radius: 0 0 10px 10px;
          padding: 5px;
          user-select: text;
          cursor: auto;
        }

        #time {
          display:flex inline;
          justify-content: center;
          border-radius: 10px;
          padding: 2px;
          background-color: rgba(60,75,90,0.4);
          width: 180px;
        }

        textarea {
          width: 100%;
          height: calc(100% - 25px);
          resize: none;
          box-sizing: border-box;
          padding: 12px;
          font-family: inherit;
          font-size: 1rem;
          outline: none;
          border: solid 1px lightgray;
        }

        .selectedapp {
          outline: solid 2px cyan;
        }

        .app button {
          all:unset;
          cursor:pointer;
        }

        .appicon {
          margin-left: 6px;
          margin-right: 6px;
        }

        .menubtn {
          color:white;
        }

        .menubtn:hover {
          color: white;
          background-color: none;
          text-shadow: 0 0 5px white;
        }
      </style>
    </head>
    <body>
      <dialog id="welcomepopup">
        <h1><b>Welcome to Simple OS</b></h1><form method="dialog"><button class="startbutton"><b>Start</b></button></form>
      </dialog>
      <script>
        const popup = document.getElementById('welcomepopup');
        popup.showModal();
        var launcher = 0
      </script>
      <div id="taskbar">
        <button onclick="
          if (launcher == 1) {
            launcher = 0
            document.getElementById('launcher').style.opacity = '0';
            document.getElementById('launcher').style.pointerEvents = 'none';
            document.getElementById('launcher').style.userSelect = 'none';
          } else {
            launcher = 1
            document.getElementById('launcher').style.opacity = '1';
            document.getElementById('launcher').style.pointerEvents = 'auto';
            document.getElementById('launcher').style.userSelect = 'auto';
          }">
            <div class="circle"></div>
          </button>
          <span style="display: flex;">
            <button class="appicon" onclick="document.getElementById('documentedit-app').style.display = 'block'">📓</button>
            <button class="appicon" onclick="document.getElementById('weather-app').style.display = 'block'">🌦</button>
            <button class="appicon" onclick="document.getElementById('settings-app').style.display = 'block'">⚙️</button>
            <button class="appicon" onclick="document.getElementById('calc-app').style.display = 'block'">🖩</button>
          </span>
          <span id="time" style="margin-right:10px;">00/00/0000 00:00 XX</span>
      </div>

      <div id="launcher">
        <span onclick="document.getElementById('info-app').style.display = 'block'" style="cursor:pointer-events">SimpleOS</span>
      </div>

      <div id="info-app" class="appdrag">
        <button onclick="document.getElementById('info-app').style.display = 'none'">X</button>
        <div class="app">
          SimpleOS version 0.1
        </div>
      </div>

      <div id="documentedit-app" class="appdrag">
        <button onclick="document.getElementById('documentedit-app').style.display = 'none'">X</button>
        <div class="app">
          SimpleOS Document editor
          <br>
          <textarea placeholder="Enter text here..."></textarea>
        </div>
      </div>

      <div id="weather-app" class="appdrag">
        <button onclick="document.getElementById('weather-app').style.display = 'none'">X</button>
        <div class="app" style="background-color: black; color: white;">
          SimpleOS Weather App
          <br>
          <iframe src="https://wttr.in" width="100%" height="150" frameborder="0"></iframe>
        </div>
      </div>

      <div id="settings-app" class="appdrag">
        <button onclick="document.getElementById('settings-app').style.display = 'none'">X</button>
        <div class="app" style="background-color: rgba(20,25,30,0.6); color:white;">
          Settings
          <br>
          <button class="menubtn" onclick="
          document.getElementById('settingWallpaperDiv').style.display = 'block'
          document.getElementById('settingAboutDiv').style.display = 'none'
          ">Wallpaper</button>
          <button class="menubtn" onclick="
          document.getElementById('settingAboutDiv').style.display = 'block'
          document.getElementById('settingWallpaperDiv').style.display = 'none'
          ">About</button>
          <br>
          <div id="settingWallpaperDiv" style="padding: 10px; border-radius: 10px; background-color: rgba(60,75,90,0.6);">
            <button onclick="document.body.style.backgroundImage = `url('https://abrowny2944.neocities.org/VMBG.png')`"><img width="150px" src="https://abrowny2944.neocities.org/VMBG.png"></button>
            <button onclick="document.body.style.backgroundImage = `url('https://abrowny2944.neocities.org/VMBG2.png')`"><img width="150px" src="https://abrowny2944.neocities.org/VMBG2.png"></button>
            <button onclick="document.body.style.backgroundImage = `url('https://abrowny2944.neocities.org/VMBG3.png')`"><img width="150px" src="https://abrowny2944.neocities.org/VMBG3.png"></button>
            <input type="color" style="width: 150px; height: 84px; background-color: rgba(20,25,30,0.6); border: none;" value="#000000" oninput="document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = this.value;">
          </div>
          <div id="settingAboutDiv" style="padding: 10px; display:none; border-radius: 10px; background-color: rgba(60,75,90,0.6);">
            SimpleOS version 0.1
            <br>
            <a style="color: skyblue;" href="https://github.com/Abrowny2944/SimpleOS">Source code</a>
            <br>
            <br>
            System font: <a style="color:skyblue" href="https://fonts.google.com/specimen/Monomaniac+One">Monomaniac One</a>
            <br>
            <br>
            Wallpapers rendered using: <a style="color:skyblue" href="https://www.shadertoy.com/">Shadertoy</a>
          </div>
        </div>
      </div>

      <div id="calc-app" class="appdrag">
        <button onclick="document.getElementById('calc-app').style.display = 'none'">X</button>
        <div style="background-color: black; color:white;" class="app">
          <iframe src="https://calculator-1.com/outdoor/?f=000000&r=000000" width="218px" height="302px" frameborder="0"></iframe>
        </div>
      </div>

      <script>
        const appWindows = document.querySelectorAll('.appdrag');
        appWindows.forEach(win => {
          let activeX = 0;
          let activeY = 0;
          let offsetX = 0;
          let offsetY = 0;

          win.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.app')) {
              return;
            }

            e.preventDefault();

            offsetX = e.clientX;
            offsetY = e.clientY;

            document.addEventListener('mousemove', dragWindow);
            document.addEventListener('mouseup', closeDragWindow);
          });

          function dragWindow(e) {
            e.preventDefault();

            activeX = offsetX - e.clientX;
            activeY = offsetY - e.clientY;

            offsetX = e.clientX;
            offsetY = e.clientY;

            win.style.top = (win.offsetTop - activeY) + "px";
            win.style.left = (win.offsetLeft - activeX) + "px";
          }

          function closeDragWindow() {
            document.removeEventListener('mousemove', dragWindow);
            document.removeEventListener('closeDragWindow');
          }
        });

        function updateTime() {
          var currentTime = new
          Date().toLocaleString();
          var timeText = document.querySelector("#time");
          timeText.innerHTML = currentTime;
        }

        setInterval(updateTime, 1000);
      </script>
    </body>
  </html>
